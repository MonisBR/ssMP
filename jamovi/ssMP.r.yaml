name: ssMP
title: Sample Size Results
jrs: '1.1'

items:

  # 1. One-sample mean
  - name: tableOM
    title: Sample Size for One-Sample Mean. Infinite population.
    type: Table
    visible: (tipo == 'media')
    rows: 5
    columns:
      - name: parameter
        title: Parameter
        type: text
      - name: value
        title: Value
        type: text

  # 2. One-sample proportion
  - name: tableOP
    title: Sample Size for One-Sample Proportion (Normal aprox.). Infinite population.
    type: Table
    visible: (tipo == 'proporcion')
    rows: 5
    columns:
      - name: parameter
        title: Parameter
        type: text
      - name: value
        title: Value
        type: text

  # 3. Two means different variance (Welch)
  - name: tableIM
    title: Sample Size for Two Independent Means different variance (Welch)
    type: Table
    visible: (tipo == 'dosMediasVD')
    rows: 10
    columns:
      - name: parameter
        title: Parameter
        type: text
      - name: value
        title: Value
        type: text

  # 4. Two means common variance (Pooled)
  - name: tablePM
    title: Sample Size for Two Independent Means common variance (Pooled)
    type: Table
    visible: (tipo == 'dosMediasVC')
    rows: 9
    columns:
      - name: parameter
        title: Parameter
        type: text
      - name: value
        title: Value
        type: text

  # 5. Dos proporcionesTwo proportions (Chi-Square)
  - name: tableIP
    title: Sample Size for Two Independent Proportions
    type: Table
    visible: (tipo == 'dosProporciones')
    rows: 10
    columns:
      - name: parameter
        title: Parameter
        type: text
      - name: value
        title: Value
        type: text